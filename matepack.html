<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mate pack</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #0a0a0f, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden;
    color: white;
    animation: backgroundPulse 10s ease-in-out infinite alternate;
    transition: background 0.5s ease;
}

body.reveal {
    background: radial-gradient(circle at center, rgba(0,0,0,0.8), #000);
}

@keyframes backgroundPulse {
    from { background: radial-gradient(circle at top, #0a0a0f, #000); }
    to { background: radial-gradient(circle at top, #1a1a2e, #000); }
}

.glass-panel {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
}

.login {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: min(90%, 400px);
    text-align: center;
}

.login input, #langSelect, #langSelectGame {
    margin: 10px 0;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    width: 100%;
    background: rgba(0,0,0,0.5);
    color: white;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
}

.login input::placeholder { color: #aaa; }
.login input:focus, #langSelect:focus { border-color: #ff00ff; outline: none; }
#langSelect option, #langSelectGame option { background: #111; color: white; }

button {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    color: black;
    margin-top: 10px;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255,0,255,0.3);
}

button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,0,255,0.5); filter: brightness(1.1); }
button:active { transform: translateY(0); }

.game {
    width: 100%;
    max-width: 1300px;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 300px 1fr 300px;
    gap: 20px;
    padding: 20px;
    align-items: center;
    box-sizing: border-box;
}

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
}

.panel, .chances-panel { max-height: 80vh; overflow-y: auto; }
.panel::-webkit-scrollbar, .chances-panel::-webkit-scrollbar { width: 5px; }
.panel::-webkit-scrollbar-thumb, .chances-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
.panel h4, .chances-panel h4, #adminPanel h4 { margin-top: 0; margin-bottom: 15px; text-align: center; font-size: 18px; }

.card-item {
    padding: 12px;
    margin: 8px 0;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    font-size: 14px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
}

.card-item span {
    flex: 1;
    font-size: 13px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.view3d-btn {
    padding: 8px 12px !important;
    background: rgba(255,255,255,0.1) !important;
    background-image: none !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    border-radius: 10px !important;
    color: #fff !important;
    font-size: 12px !important;
    cursor: pointer !important;
    margin-top: 0 !important;
    box-shadow: none !important;
    min-width: 60px;
    width: auto;
}
.view3d-btn:hover { background: rgba(255,255,255,0.2) !important; transform: translateY(-1px) !important; }

.card-back {
    background: url('goldencard.jpg') center center / cover no-repeat;
    border: 3px solid #c8a84b;
}

.viewer-card-back {
    background: url('goldencard.jpg') center center / cover no-repeat;
    border: 2px solid #c8a84b;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* =============================================
   THE CARD — flip & open
   ============================================= */
.card {
    width: min(70vw, 280px);
    height: min(100vw, 380px);
    perspective: 1200px;
    cursor: pointer;
    transition: transform 0.3s ease, width 0.5s ease, height 0.5s ease;
}
.card:hover { transform: scale(1.05); }
.card.open {
    width: min(85vw, 340px);
    height: min(120vw, 460px);
    transform: scale(1.1);
    z-index: 10;
    position: relative;
}
.card.closing { animation: cardClose 0.3s ease forwards; }
@keyframes cardClose { to { transform: scale(0.5); opacity: 0; } }

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
}

/* FIX: card starts showing back (rotateY 0), flips to front (rotateY 180) */
.card.open .card-inner { animation: cardFlip 1.4s cubic-bezier(.2,.8,.2,1) forwards; }

@keyframes cardFlip {
    0%   { transform: rotateY(0deg)   scale(1);    }
    50%  { transform: rotateY(90deg)  scale(1.1);  }
    100% { transform: rotateY(180deg) scale(1.08); }
}

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    backface-visibility: hidden;
    overflow: hidden; /* 🔥 IMPORTANT FIX */
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* Back sits at 0deg — visible by default */
/* Front sits at 180deg — revealed after flip */
.card-front {
    transform: rotateY(180deg);
    background: linear-gradient(135deg, #111, #222);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    padding: 15px;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.1);
}

/* Card front animations */
.card-front.anim-anano      { animation: glow 1.5s ease-in-out infinite alternate, pulseRotate 3s ease-in-out infinite; }
.card-front.anim-twin-mari  { animation: glow 1.5s ease-in-out infinite alternate, heartbeat 1.2s ease-in-out infinite; }
.card-front.anim-dog        { animation: glow 1.5s ease-in-out infinite alternate, bounce 1.4s ease-in-out infinite; }
.card-front.anim-babai      { animation: glow 1.5s ease-in-out infinite alternate, floatUp 3s ease-in-out infinite; }
.card-front.anim-qurdi-mari { animation: glow 1.5s ease-in-out infinite alternate, glitch 1.3s steps(2,end) infinite; }
.card-front.anim-luka       { animation: glow 1.5s ease-in-out infinite alternate, twinkle 2.5s ease-in-out infinite; }
.card-front.anim-mari       { animation: glow 1.5s ease-in-out infinite alternate, hueShift 4s linear infinite; }
.card-front.anim-nini       { animation: glow 1.5s ease-in-out infinite alternate, sparkleGlow 2s ease-in-out infinite; }
.card-front.anim-photo1     { animation: glow 1.5s ease-in-out infinite alternate, drift 3.5s ease-in-out infinite; }
.card-front.anim-photo2     { animation: glow 1.5s ease-in-out infinite alternate, flarePulse 2s ease-in-out infinite; }

@keyframes pulseRotate  { 0%,100% { transform: rotateY(180deg) scale(1); }    50% { transform: rotateY(180deg) scale(1.04); } }
@keyframes heartbeat    { 0%,100% { transform: rotateY(180deg) scale(1); }    50% { transform: rotateY(180deg) scale(1.12); } }
@keyframes bounce       { 0%,100% { transform: rotateY(180deg) translateY(0); } 50% { transform: rotateY(180deg) translateY(-12px); } }
@keyframes floatUp      { 0%,100% { transform: rotateY(180deg) translateY(0); } 50% { transform: rotateY(180deg) translateY(-10px); } }
@keyframes glitch       { 0%,100% { transform: rotateY(180deg) translateX(0) skewX(0deg); } 25% { transform: rotateY(180deg) translateX(-4px) skewX(-2deg); } 50% { transform: rotateY(180deg) translateX(3px) skewX(2deg); } 75% { transform: rotateY(180deg) translateX(-2px) skewX(-1deg); } }
@keyframes twinkle      { 0%,100% { box-shadow: 0 0 20px #ffea00, inset 0 0 20px rgba(255,234,0,.12); } 50% { box-shadow: 0 0 50px #ffffff, inset 0 0 40px rgba(255,255,255,.25); } }
@keyframes hueShift     { 0% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(45deg); } 100% { filter: hue-rotate(0deg); } }
@keyframes sparkleGlow  { 0%,100% { box-shadow: 0 0 20px rgba(255,255,255,.2), inset 0 0 20px rgba(255,255,255,.08); } 50% { box-shadow: 0 0 60px rgba(255,255,255,.45), inset 0 0 40px rgba(255,255,255,.18); } }
@keyframes drift        { 0%,100% { transform: rotateY(180deg) translateX(0); } 50% { transform: rotateY(180deg) translateX(8px); } }
@keyframes flarePulse   { 0%,100% { box-shadow: 0 0 20px rgba(255,110,204,.5), inset 0 0 20px rgba(255,110,204,.12); } 50% { box-shadow: 0 0 80px rgba(255,110,204,.9), inset 0 0 40px rgba(255,110,204,.25); } }

@keyframes glow {
    from { box-shadow: 0 0 20px #00f2ff, inset 0 0 20px rgba(0,242,255,0.1); }
    to   { box-shadow: 0 0 40px #ff00ff, inset 0 0 40px rgba(255,0,255,0.1); }
}

#frontImage { width: 90%; height: 55%; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); box-shadow: 0 0 15px rgba(0,0,0,0.5); flex-shrink: 0; }
#frontName  { font-size: 22px; margin-bottom: 5px; }
#frontRarity { font-size: 14px; font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }

.rare-reveal { animation: rarePulse 0.5s ease-in-out infinite alternate, rareShake 0.1s ease-in-out infinite; }
@keyframes rarePulse { from { box-shadow: 0 0 40px #ff00ff, inset 0 0 20px rgba(255,0,255,0.1); } to { box-shadow: 0 0 80px #ff00ff, inset 0 0 40px rgba(255,0,255,0.2); } }
@keyframes rareShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
.rare-body  { animation: rareGlow 2s ease-out; }
@keyframes rareGlow  { 0% { background: radial-gradient(circle at center, rgba(255,0,255,0.1),#000); } 50% { background: radial-gradient(circle at center, rgba(255,0,255,0.3),#000); } 100% { background: radial-gradient(circle at center, rgba(0,0,0,0.8),#000); } }

.mega-body { animation: megaBodyPulse 3.5s cubic-bezier(0.25,1,0.5,1) forwards !important; }
@keyframes megaBodyPulse {
    0%   { background: #000; filter: brightness(1); }
    10%  { background: #fff; filter: brightness(5); }
    30%  { background: radial-gradient(circle at center, #ff00ff, #000); filter: brightness(2); }
    100% { background: radial-gradient(circle at center, rgba(255,110,204,0.4), #000); filter: brightness(1); }
}
.mega-reveal { animation: megaShake 0.5s ease-in-out infinite, megaFloat 3s ease-in-out infinite; z-index: 9999 !important; }
.card.open.mega-reveal { width: min(90vw,380px); height: min(130vw,520px); }
@keyframes megaShake { 0%,100% { transform: scale(1.15) translate(0,0) rotate(0deg); } 25% { transform: scale(1.15) translate(-4px,4px) rotate(-1deg); } 50% { transform: scale(1.15) translate(4px,-4px) rotate(1deg); } 75% { transform: scale(1.15) translate(-4px,-4px) rotate(-1deg); } }
@keyframes megaFloat  { 0%,100% { filter: drop-shadow(0 0 50px #ff6ecc) drop-shadow(0 0 100px rgba(255,110,204,.8)); } 50% { filter: drop-shadow(0 0 100px #fff) drop-shadow(0 0 200px #00ffff); } }
.card-front.anim-mega-mate { animation: glowMega 1s ease-in-out infinite alternate; border: 3px solid #ff6ecc; }
@keyframes glowMega { from { box-shadow: 0 0 50px #ff6ecc, inset 0 0 30px rgba(255,110,204,.5); } to { box-shadow: 0 0 100px #fff, inset 0 0 80px #00ffff; } }

/* =============================================
   3D VIEWER OVERLAY
   FIX: viewer starts showing the FRONT at rotateY(0)
   since viewer-card-front is NOT rotated — it's the default face.
   viewer-card-back is the one rotated 180deg (back side).
   ============================================= */
.viewer-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.88), rgba(0,0,0,0.98));
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 20px;
    box-sizing: border-box;
    backdrop-filter: blur(10px);
}
.viewer-overlay.show { display: flex; }

.viewer-content {
    position: relative;
    width: min(100%, 400px);
    background: rgba(10,10,20,0.97);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 28px 24px 24px;
    box-shadow: 0 0 80px rgba(0,255,255,0.12);
    box-sizing: border-box;
}

.close-viewer {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.1) !important;
    background-image: none !important;
    border: 1px solid rgba(255,255,255,0.25) !important;
    color: #fff !important;
    padding: 8px 18px !important;
    border-radius: 999px !important;
    font-size: 12px !important;
    box-shadow: none !important;
    cursor: pointer !important;
    margin-top: 0 !important;
    z-index: 5;
    width: auto;
}
.close-viewer:hover { background: rgba(255,255,255,0.2) !important; }

.viewer-scene {
    position: relative;
    width: 100%;
    height: 320px;
    margin-top: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.viewer-card        { width: 240px; height: 320px; perspective: 1000px; cursor: grab; touch-action: none; user-select: none; flex-shrink: 0; }
.viewer-card-inner  { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.05s linear; }
.viewer-card-face   { position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; overflow: hidden; }

/* FIXED: front at 0deg (default visible), back at 180deg (hidden until rotated) */
.viewer-card-front {
    /* No rotation — faces the viewer by default */
    background: linear-gradient(180deg, #141428, #0a0a18);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 16px; gap: 10px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.6);
    box-sizing: border-box;
}
.viewer-card-front img { width: 100%; height: 170px; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); display: block; flex-shrink: 0; }

/* back at 180deg so it shows when card is rotated around */
.viewer-card-back {
    transform: rotateY(180deg);
    background: url('goldencard.jpg') center center / cover no-repeat;
    border: 2px solid #c8a84b;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

#viewerName   { color: #fff; font-size: 18px; font-weight: bold; text-align: center; }
#viewerRarity { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; text-align: center; }
.viewer-instructions { margin-top: 14px; color: rgba(255,255,255,0.45); font-size: 12px; text-align: center; letter-spacing: 0.5px; }
.chances-panel div { margin: 5px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }

@keyframes fadeIn { to { opacity: 1; } }

@media (max-width: 900px) {
    .game { display: flex; flex-direction: column; padding: 15px; min-height: auto; }
    .panel, .chances-panel, #adminPanel { width: 100%; max-width: 500px; order: 2; margin-bottom: 15px; max-height: 350px; }
    .center { order: 1; width: 100%; min-height: 50vh; margin-bottom: 20px; }
    .card { width: min(65vw,240px); height: min(90vw,320px); }
    .card.open { width: min(80vw,280px); height: min(110vw,380px); transform: scale(1.05); }
    .card:hover { transform: none; }
    .viewer-content { width: calc(100vw - 40px); padding: 18px; }
    .viewer-card { width: 180px; height: 240px; }
    .viewer-card-front img { height: 120px; }
    .viewer-scene { height: 240px; }
    .card-back::after, .viewer-card-back::after { font-size: 13px; }
}

</style>
</head>
<body>

<div id="login" class="login glass-panel" style="margin: auto; display: flex;">
    <h2 id="loginTitle" style="margin-top:0;">Card Game Login</h2>
    <select id="langSelect" onchange="changeLang(this.value)">
        <option value="en">English</option>
        <option value="ka">ქართული</option>
    </select>
    <input type="text" id="loginName" placeholder="Username" />
    <input type="password" id="loginPass" placeholder="Password" />
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="signupBtn" onclick="signup()" style="background: rgba(255,255,255,0.1); color: white; box-shadow: none;">Sign Up</button>
    <p id="loginMsg" style="color: #ff5555; font-size: 14px; margin-top: 15px;"></p>
</div>

<div id="game" class="game" style="display: none;">

    <div class="panel glass-panel">
        <h4 id="libraryTitle">Library - <span id="userName"></span></h4>
        <button onclick="logout()" style="padding: 8px; font-size: 12px; margin-bottom: 15px;">Logout</button>
        <select id="langSelectGame" onchange="changeLang(this.value)">
            <option value="en">English</option>
            <option value="ka">ქართული</option>
        </select>
        <div id="library"></div>
    </div>

    <div class="center">
        <div class="card" id="card" onclick="handleCardClick()">
            <div class="card-inner">
                <div class="card-face card-back"></div>
                <div class="card-face card-front" id="cardFront">
                    <img id="frontImage" src="" alt="Card image" style="display:none;" />
                    <div id="frontName">TAP TO OPEN</div>
                    <div id="frontRarity"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="chances-panel glass-panel">
        <h4 id="chancesTitle">Card Chances</h4>
        <div id="chances"></div>
    </div>

    <div id="adminPanel" class="glass-panel" style="display: none; grid-column: 1 / -1; width: 100%; max-width: 500px; margin: 0 auto;">
        <h4 id="adminTitle">Admin Panel</h4>
        <h4 id="summonTitle" style="font-size: 16px; color: #ff00ff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Summon Cards</h4>
        <div id="summonButtons" style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;"></div>
        
        <h4 id="accountsTitle" style="margin-top:20px; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">User Accounts</h4>
        <div id="accountList" style="font-size: 13px; line-height: 1.4; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;">Loading accounts...</div>
    </div>

    <div id="viewerOverlay" class="viewer-overlay">
        <div class="viewer-content" onclick="event.stopPropagation()">
            <button class="close-viewer" id="closeViewerBtn">Drop</button>
            <div class="viewer-scene">
                <div class="viewer-card" id="viewerCard">
                    <div class="viewer-card-inner" id="viewerCardInner">
                        <!-- FIXED ORDER: front first (0deg = visible), back second (180deg = hidden) -->
                        <div class="viewer-card-face viewer-card-front" id="viewerCardFront">
                            <img id="viewerImage" src="" alt="Preview" />
                            <div id="viewerName"></div>
                            <div id="viewerRarity"></div>
                        </div>
                        <div class="viewer-card-face viewer-card-back"></div>
                    </div>
                </div>
            </div>
            <div class="viewer-instructions" id="viewerInstructions">Drag to rotate 360°</div>
        </div>
    </div>

</div>

<script>

const cards = [
    { name_en: "anano",          name_ka: "ანანო",              rarity: "COMMON",    color: "#f0c040", image: "662170083_1490511509297584_7921407953045708354.jpg" },
    { name_en: "elene bokveri",  name_ka: "ელენე ბოქვერი",      rarity: "UNCOMMON",  color: "#4ecdc4", image: "651267824_1495623969012841_63837904079999546.jpg" },
    { name_en: "cool babai",     name_ka: "ქულ ბაბაი",          rarity: "RARE",      color: "#ff9f1c", image: "cool babai.jpg" },
    { name_en: "babai",          name_ka: "ბაბაი",              rarity: "ULTRA",     color: "#74b9ff", image: "babai.jpg" },
    { name_en: "qurdi mari",     name_ka: "ქურდი მარი",         rarity: "COMMON",    color: "#7c82ff", image: "qurdimari.jpg" },
    { name_en: "Luka",           name_ka: "ლუკა",               rarity: "RARE",      color: "#ffa9d1", image: "luka.jpg" },
    { name_en: "twin Mari",      name_ka: "ტყუპი მარი",         rarity: "RARE",      color: "#ffba3b", image: "mari.jpg" },
    { name_en: "mini nini",      name_ka: "მინი ნინი",          rarity: "EPIC",      color: "#54d2ff", image: "nini.jpg" },
    { name_en: "double wveri",   name_ka: "ორმაგი წვერი",       rarity: "UNCOMMON",  color: "#d477ff", image: "wveri.jpg" },
    { name_en: "legend MATE",    name_ka: "ლეგენდარული მათე",   rarity: "LEGENDARY", color: "#ff6ecc", image: "MATE.jpg" }
];

const cardAnimations = [
    'anim-anano','anim-twin-mari','anim-dog','anim-babai','anim-qurdi-mari',
    'anim-luka','anim-mari','anim-nini','anim-photo1','anim-mega-mate'
];

let library = [];
let audioCtx;
let cardState = 'closed';
let currentUser = null;
let cardWeights = [13, 16, 7, 13, 16, 7, 6, 10, 10, 2];
let isAdmin = false;
let currentLang = 'en';

// ============================================================
// VIEWER ROTATION — FIXED
// Front face is at 0deg. We start rotY=0 so the front is visible.
// Dragging right rotates toward the back (rotY=180).
// ============================================================
let currentViewerRotX = 5;
let currentViewerRotY = 0;   // FIX: start at 0 so front face is shown
let viewerDragging = false;
let viewerDragStartX = 0;
let viewerDragStartY = 0;
let viewerBaseX = 5;
let viewerBaseY = 0;

const translations = {
    en: {
        loginTitle: "Card Game Login", username: "Username", password: "Password",
        login: "Login", signup: "Sign Up", enterNamePass: "Enter name and password",
        wrongPassDuck: "Wrong password for duck", userNotFound: "User not found. Use Sign Up.",
        wrongPass: "Wrong password", usernameTaken: "Username taken",
        cannotSignupDuck: "Cannot sign up as duck", library: "Library",
        logout: "Logout", cardChances: "Card Chances", adminPanel: "Admin Panel",
        summonTitle: "Summon Cards", userAccounts: "User Accounts", loadingAccounts: "Loading accounts...",
        view3D: "3D View", drop: "Drop", viewerInstructions: "Drag to rotate 360°",
        tapToOpen: "TAP TO OPEN", chance: "chance", enterAdminPass: "Enter admin password:",
        adminUnlocked: "Admin unlocked!"
    },
    ka: {
        loginTitle: "ბარათის თამაშის შესვლა", username: "მომხმარებლის სახელი", password: "პაროლი",
        login: "შესვლა", signup: "რეგისტრაცია", enterNamePass: "შეიყვანეთ სახელი და პაროლი",
        wrongPassDuck: "არასწორი პაროლი duck-ისთვის", userNotFound: "მომხმარებელი არ მოიძებნა. გამოიყენეთ რეგისტრაცია.",
        wrongPass: "არასწორი პაროლი", usernameTaken: "მომხმარებლის სახელი დაკავებულია",
        cannotSignupDuck: "შეუძლებელია რეგისტრაცია duck-ად", library: "ბიბლიოთეკა",
        logout: "გასვლა", cardChances: "ბარათის შანსები", adminPanel: "ადმინის პანელი",
        summonTitle: "ბარათების გამოძახება", userAccounts: "მომხმარებლების ანგარიშები", loadingAccounts: "ანგარიშების ჩატვირთვა...",
        view3D: "3D ნახვა", drop: "დაბრუნება", viewerInstructions: "გასწორეთ და მოატრიალეთ 360°",
        tapToOpen: "დააჭირეთ გასახსნელად", chance: "შანსი", enterAdminPass: "შეიყვანეთ ადმინის პაროლი:",
        adminUnlocked: "ადმინი გახსნილია!"
    }
};

function init() {
    updateChances();
    initViewerGesture();

    document.getElementById('closeViewerBtn').addEventListener('click', function(e) {
        e.stopPropagation(); closeViewer();
    });
    document.getElementById('viewerOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeViewer();
    });
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeViewer();
        if (e.shiftKey && e.key === '~') {
            const pass = prompt(translations[currentLang].enterAdminPass);
            if (pass === '361') {
                isAdmin = true;
                if (document.getElementById('game').style.display !== 'none') {
                    document.getElementById('adminPanel').style.display = 'block';
                    updateAdminSummon(); updateAdminAccounts();
                }
                alert(translations[currentLang].adminUnlocked);
            }
        }
    });

    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
        currentUser = savedUser; loadLibrary(); showGame();
    } else {
        showLogin();
    }
}

function showLogin() {
    document.getElementById('login').style.display = 'flex';
    document.getElementById('game').style.display = 'none';
}

function changeLang(lang) {
    currentLang = lang; updateUI();
    document.getElementById('langSelect').value = lang;
    const gameSelect = document.getElementById('langSelectGame');
    if (gameSelect) gameSelect.value = lang;
}

function updateUI() {
    const t = translations[currentLang];
    document.getElementById('loginTitle').innerText = t.loginTitle;
    document.getElementById('loginName').placeholder = t.username;
    document.getElementById('loginPass').placeholder = t.password;
    document.getElementById('loginBtn').innerText = t.login;
    document.getElementById('signupBtn').innerText = t.signup;

    const libTitle = document.getElementById('libraryTitle');
    if (libTitle) libTitle.innerHTML = t.library + ' - <span id="userName">' + (currentUser || '') + '</span>';
    const chancesTitle = document.getElementById('chancesTitle');
    if (chancesTitle) chancesTitle.innerText = t.cardChances;
    const adminTitle = document.getElementById('adminTitle');
    if (adminTitle) adminTitle.innerText = t.adminPanel;
    const accountsTitle = document.getElementById('accountsTitle');
    if (accountsTitle) accountsTitle.innerText = t.userAccounts;
    const saveBtn = document.querySelector('#adminPanel > button');
    if (saveBtn) saveBtn.innerText = t.saveChanges;

    document.getElementById('closeViewerBtn').innerText = t.drop;
    document.getElementById('viewerInstructions').innerText = t.viewerInstructions;
    document.getElementById('frontName').innerText = t.tapToOpen;

    updateChances(); updateLibrary();
}

function showGame() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('game').style.display = window.innerWidth <= 900 ? 'flex' : 'grid';
    const userNameEl = document.getElementById('userName');
    if (userNameEl) userNameEl.innerText = currentUser;
    updateChances();
    if ((currentUser && currentUser.toLowerCase() === 'duck') || isAdmin) {
        document.getElementById('adminPanel').style.display = 'block';
        updateAdminSummon(); updateAdminAccounts();
    } else {
        document.getElementById('adminPanel').style.display = 'none';
    }
}

window.addEventListener('resize', () => {
    if (document.getElementById('game').style.display !== 'none') {
        document.getElementById('game').style.display = window.innerWidth <= 900 ? 'flex' : 'grid';
    }
});

function login() {
    const name = document.getElementById('loginName').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if (!name || !pass) { document.getElementById('loginMsg').innerText = translations[currentLang].enterNamePass; return; }
    if (name.toLowerCase() === 'duck') {
        if (pass.toLowerCase() === 'duckman') {
            currentUser = name; localStorage.setItem('currentUser', name); loadLibrary(); showGame();
        } else { document.getElementById('loginMsg').innerText = translations[currentLang].wrongPassDuck; }
        return;
    }
    const storedPass = localStorage.getItem('password_' + name);
    if (!storedPass) { document.getElementById('loginMsg').innerText = translations[currentLang].userNotFound; return; }
    if (storedPass === pass) {
        currentUser = name; localStorage.setItem('currentUser', name); loadLibrary(); showGame();
    } else { document.getElementById('loginMsg').innerText = translations[currentLang].wrongPass; }
}

function signup() {
    const name = document.getElementById('loginName').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!name || !pass) { document.getElementById('loginMsg').innerText = translations[currentLang].enterNamePass; return; }
    if (name.toLowerCase() === 'duck') { document.getElementById('loginMsg').innerText = translations[currentLang].cannotSignupDuck; return; }
    if (localStorage.getItem('password_' + name)) { document.getElementById('loginMsg').innerText = translations[currentLang].usernameTaken; return; }
    localStorage.setItem('password_' + name, pass);
    currentUser = name; localStorage.setItem('currentUser', name);
    library = []; showGame();
}

function logout() {
    saveLibrary();
    localStorage.removeItem('currentUser');
    currentUser = null; library = []; isAdmin = false;
    showLogin();
}

function loadLibrary() {
    const saved = localStorage.getItem('library_' + currentUser);
    library = saved ? JSON.parse(saved) : [];
    updateLibrary();
}

function saveLibrary() {
    if (currentUser) localStorage.setItem('library_' + currentUser, JSON.stringify(library));
}

function updateLibrary() {
    const libDiv = document.getElementById('library');
    if (!libDiv) return;
    libDiv.innerHTML = '';
    const counts = {};
    library.forEach(card => {
        const countKey = card.name_en;
        if (!counts[countKey]) {
            const arrayIndex = cards.findIndex(c => c.name_en === card.name_en);
            counts[countKey] = { card: card, count: 0, arrayIndex: arrayIndex };
        }
        counts[countKey].count++;
    });
    Object.values(counts).forEach(({ card, count, arrayIndex }) => {
        const div = document.createElement('div');
        div.className = 'card-item';
        if (arrayIndex >= 0) {
            div.innerHTML = `
                <span style="color:${card.color}">${card['name_' + currentLang]} x${count}</span>
                <button class="view3d-btn" onclick="showCardViewer(${arrayIndex})">${translations[currentLang].view3D}</button>
            `;
        } else {
            div.innerHTML = `<span style="color:${card.color}">${card['name_' + currentLang]} x${count}</span>`;
        }
        libDiv.appendChild(div);
    });
}

function showCardViewer(cardIndex) {
    const card = cards[cardIndex];
    if (!card) return;

    const viewerImg = document.getElementById('viewerImage');
    viewerImg.src = card.image;
    if (card.name_en === "cool babai") {
        viewerImg.style.objectPosition = "top";
    } else if (["anano", "qurdi mari"].includes(card.name_en)) {
        viewerImg.style.objectPosition = "center 20%";
    } else {
        viewerImg.style.objectPosition = "center";
    }
    viewerImg.alt = card.name_en;
    document.getElementById('viewerName').innerText = card['name_' + currentLang];
    document.getElementById('viewerName').style.color = card.color;
    document.getElementById('viewerRarity').innerText = card.rarity;
    document.getElementById('viewerRarity').style.color = card.color;

    const front = document.getElementById('viewerCardFront');
    front.style.boxShadow = `0 0 30px ${card.color}50, inset 0 0 20px ${card.color}18`;
    front.style.borderColor = card.color + '33';

    // FIXED: reset to 0 so front face (which is at 0deg) is shown immediately
    currentViewerRotX = 5;
    currentViewerRotY = 0;
    viewerBaseX = 5;
    viewerBaseY = 0;
    updateViewerTransform();

    document.getElementById('closeViewerBtn').innerText = translations[currentLang].drop;
    document.getElementById('viewerInstructions').innerText = translations[currentLang].viewerInstructions;
    document.getElementById('viewerOverlay').classList.add('show');
}

function closeViewer() {
    document.getElementById('viewerOverlay').classList.remove('show');
}

function updateViewerTransform() {
    const inner = document.getElementById('viewerCardInner');
    if (!inner) return;
    inner.style.transform = `rotateX(${currentViewerRotX}deg) rotateY(${currentViewerRotY}deg)`;
}

function initViewerGesture() {
    const viewerCard = document.getElementById('viewerCard');
    if (!viewerCard) return;

    viewerCard.addEventListener('pointerdown', e => {
        viewerDragging = true;
        viewerDragStartX = e.clientX;
        viewerDragStartY = e.clientY;
        viewerBaseX = currentViewerRotX;
        viewerBaseY = currentViewerRotY;
        viewerCard.setPointerCapture(e.pointerId);
        viewerCard.style.cursor = 'grabbing';
    });
    viewerCard.addEventListener('pointermove', e => {
        if (!viewerDragging) return;
        const dx = e.clientX - viewerDragStartX;
        const dy = e.clientY - viewerDragStartY;
        currentViewerRotY = viewerBaseY + dx * 0.5;
        currentViewerRotX = Math.min(55, Math.max(-35, viewerBaseX - dy * 0.3));
        updateViewerTransform();
    });
    const endDrag = () => { viewerDragging = false; viewerCard.style.cursor = 'grab'; };
    viewerCard.addEventListener('pointerup', endDrag);
    viewerCard.addEventListener('pointercancel', endDrag);
}

function getWeightedRandomCard() {
    const total = cardWeights.reduce((a, b) => a + b, 0);
    let rand = Math.random() * total;
    for (let i = 0; i < cards.length; i++) {
        rand -= cardWeights[i];
        if (rand <= 0) return { card: cards[i], index: i };
    }
    return { card: cards[0], index: 0 };
}

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.value = 0.1;
        osc.frequency.value = type === 'flip' ? 400 : 600;
        osc.type = 'sine';
        osc.start();
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.stop(audioCtx.currentTime + 0.5);
    } catch(e) {}
}

function openCard() {
    if (cardState !== 'closed') return;
    cardState = 'opening';
    playSound('flip');

    const card = document.getElementById("card");
    card.classList.add("open");
    card.style.pointerEvents = "none";
    document.body.classList.add("reveal");

    const result = getWeightedRandomCard();
    const reward = result.card;
    const animClass = cardAnimations[result.index];
    const cardFront = document.getElementById("cardFront");
    clearCardAnimations(cardFront);
    cardFront.classList.add(animClass);

    const frontImage = document.getElementById("frontImage");
    frontImage.src = reward.image;
    if (reward.name_en === "cool babai") {
        frontImage.style.objectPosition = "top";
    } else if (["anano", "qurdi mari"].includes(reward.name_en)) {
        frontImage.style.objectPosition = "center 20%";
    } else {
        frontImage.style.objectPosition = "center";
    }
    frontImage.style.display = "block";
    document.getElementById("frontName").innerText = reward['name_' + currentLang];
    document.getElementById("frontName").style.color = reward.color;
    document.getElementById("frontRarity").innerText = reward.rarity;
    document.getElementById("frontRarity").style.color = reward.color;
    cardFront.style.borderColor = reward.color;
    cardFront.style.boxShadow = `0 0 40px ${reward.color}40, inset 0 0 20px ${reward.color}20`;

    const isLegendary = reward.rarity === 'LEGENDARY';
    const isRare = ['RARE', 'EPIC', 'MYTHIC', 'ULTRA'].includes(reward.rarity);

    if (isLegendary) {
        card.classList.add("mega-reveal");
        document.body.classList.add("mega-body");
        setTimeout(() => { card.classList.remove("mega-reveal"); document.body.classList.remove("mega-body"); }, 3500);
    } else if (isRare) {
        card.classList.add("rare-reveal");
        document.body.classList.add("rare-body");
        setTimeout(() => { card.classList.remove("rare-reveal"); document.body.classList.remove("rare-body"); }, 2000);
    }

    library.push(reward);
    updateLibrary();
    saveLibrary();

    setTimeout(() => {
        playSound('reveal');
        cardState = 'open';
        card.style.pointerEvents = '';
    }, 500);
}

function handleCardClick() {
    if (cardState === 'closed') openCard();
    else if (cardState === 'open') resetCard();
}

function resetCard() {
    const card = document.getElementById("card");
    const cardFront = document.getElementById("cardFront");
    card.classList.add("closing");
    card.style.pointerEvents = "none";
    cardState = 'closing';
    setTimeout(() => {
        cardState = 'closed';
        card.classList.remove("open", "closing", "rare-reveal", "mega-reveal");
        clearCardAnimations(cardFront);
        card.style.pointerEvents = "";
        document.body.classList.remove("reveal", "rare-body", "mega-body");
        document.getElementById("frontName").innerText = translations[currentLang].tapToOpen;
        document.getElementById("frontName").style.color = "";
        document.getElementById("frontRarity").innerText = "";
        cardFront.style.borderColor = "";
        cardFront.style.boxShadow = "";
        const frontImage = document.getElementById("frontImage");
        frontImage.src = "";
        frontImage.style.display = "none";
    }, 300);
}

function clearCardAnimations(el) {
    if (!el) return;
    el.classList.remove('anim-anano','anim-twin-mari','anim-dog','anim-babai','anim-qurdi-mari','anim-luka','anim-mari','anim-nini','anim-photo1','anim-photo2','anim-mega-mate');
}

function updateChances() {
    const chancesDiv = document.getElementById('chances');
    if (!chancesDiv) return;
    chancesDiv.innerHTML = '';
    const total = cardWeights.reduce((a, b) => a + b, 0);
    const ordered = cards
        .map((card, i) => ({ card, chance: (cardWeights[i] / total) * 100 }))
        .sort((a, b) => b.chance - a.chance);
    ordered.forEach(({ card, chance }) => {
        const div = document.createElement('div');
        div.innerText = `${card['name_' + currentLang]}: ${chance.toFixed(1)}% ${translations[currentLang].chance}`;
        div.style.color = card.color;
        chancesDiv.appendChild(div);
    });
}

function updateAdminSummon() {
    const summonDiv = document.getElementById('summonButtons');
    if (!summonDiv) return;
    summonDiv.innerHTML = '';
    cards.forEach((card, i) => {
        const btn = document.createElement('button');
        btn.innerText = card['name_' + currentLang];
        btn.style.cssText = `background: ${card.color}; color: black; font-size: 11px; padding: 8px; margin: 0; box-shadow: none; width: 100%;`;
        btn.onclick = () => adminSummon(i);
        summonDiv.appendChild(btn);
    });
}

function adminSummon(index) {
    library.push(cards[index]);
    updateLibrary();
    saveLibrary();
    alert(`Summoned ${cards[index]['name_' + currentLang]}!`);
}

function updateAdminAccounts() {
    const accountList = document.getElementById('accountList');
    if (!accountList) return;
    const accounts = [];
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('password_')) {
            accounts.push({ user: key.slice('password_'.length), pass: localStorage.getItem(key) });
        }
    }
    accounts.push({ user: 'duck', pass: 'duckman' });
    accounts.sort((a, b) => a.user.localeCompare(b.user));
    accountList.innerHTML = '';
    accounts.forEach(account => {
        const line = document.createElement('div');
        line.innerText = `${account.user}: ${account.pass}`;
        line.style.cssText = 'border-bottom:1px solid rgba(255,255,255,0.1);padding:4px 0;';
        accountList.appendChild(line);
    });
}

window.onload = init;
</script>
